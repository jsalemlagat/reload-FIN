<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10.24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112.64" fill="url(#bgGrad)"/>

  <!-- Inner Content container scaled -->
  <g transform="translate(38.400000000000006, 38.400000000000006) scale(0.85)">
    <!-- Subtle circular ring (Reload motif) -->
    <circle cx="256" cy="256" r="204.8" fill="none" stroke="url(#accentGrad)" stroke-width="15.36" stroke-dasharray="128 40.96" opacity="0.85"/>
    <circle cx="256" cy="256" r="168.96" fill="#1e293b" fill-opacity="0.6"/>

    <!-- Central Monogram & Peso Symbol / Reload Spark -->
    <!-- Reload Arrow Spark -->
    <path d="M215.04 112.64 L296.96 112.64 L256 71.68 Z" fill="url(#goldGrad)"/>
    
    <!-- Text BCC -->
    <text x="256" y="245.76" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="97.28" 
          fill="#ffffff" 
          text-anchor="middle" 
          letter-spacing="5.12">BCC</text>

    <!-- Subtitle RELOAD -->
    <rect x="133.12" y="286.72" width="245.76" height="71.68" rx="35.84" fill="url(#accentGrad)"/>
    <text x="256" y="340.48" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="43.52" 
          fill="#ffffff" 
          text-anchor="middle" 
          letter-spacing="10.24">RELOAD</text>

    <!-- Financial dot accent (₱) -->
    <circle cx="256" cy="394.24" r="14.336" fill="url(#goldGrad)"/>
  </g>
</svg>